<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pomodoro Study Timer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .mode-selector {
            display: flex;
            background: #0f172a;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: white;
        }
        .timer-display {
            font-size: 5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
            letter-spacing: -2px;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-main {
            background: #3b82f6;
            color: white;
        }
        .btn-main.running {
            background: #ef4444;
        }
        .btn-reset {
            background: #334155;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="mode-selector">
            <button class="mode-btn active" id="focusModeBtn" onclick="switchMode(25, 'focus')">Focus (25m)</button>
            <button class="mode-btn" id="breakModeBtn" onclick="switchMode(5, 'break')">Break (5m)</button>
        </div>

        <div class="timer-display" id="timer">25:00</div>

        <div class="controls">
            <button class="btn btn-main" id="startBtn" onclick="toggleTimer()">Start</button>
            <button class="btn btn-reset" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <script>
        let totalSeconds = 25 * 60;
        let timerId = null;
        let isRunning = false;
        let currentMode = 'focus';

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const focusBtn = document.getElementById('focusModeBtn');
        const breakBtn = document.getElementById('breakModeBtn');

        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            timerDisplay.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            document.title = `(${timerDisplay.textContent}) Pomodoro`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                timerId = null;
                isRunning = false;
                startBtn.textContent = 'Start';
                startBtn.classList.remove('running');
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                startBtn.classList.add('running');
                
                timerId = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        isRunning = false;
                        startBtn.textContent = 'Start';
                        startBtn.classList.remove('running');
                        alert(currentMode === 'focus' ? 'Focus session complete! Take a break.' : 'Break finished! Back to work.');
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.classList.remove('running');
            totalSeconds = currentMode === 'focus' ? 25 * 60 : 5 * 60;
            updateDisplay();
        }

        function switchMode(minutes, mode) {
            clearInterval(timerId);
            timerId = null;
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.classList.remove('running');
            
            currentMode = mode;
            totalSeconds = minutes * 60;
            
            if (mode === 'focus') {
                focusBtn.classList.add('active');
                breakBtn.classList.remove('active');
            } else {
                breakBtn.classList.add('active');
                focusBtn.classList.remove('active');
            }
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
